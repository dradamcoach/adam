<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>ADAM</h1>
  <p>منصة التدريب والتأهيل والتغذية</p>

  <!-- شاشة الدخول -->
  <div class="card hidden" id="login-screen">
    <h2>تسجيل الدخول</h2>
    <input type="email" id="email" placeholder="الإيميل">
    <input type="password" id="password" placeholder="الباسورد">
    <button id="login-btn">دخول</button>
    <p class="message" id="login-message"></p>
  </div>

  <!-- شاشة المدرب -->
  <div class="card hidden" id="coach-screen">
    <h2>برنامج عميل</h2>
    <input type="email" id="client-email" placeholder="إيميل العميل">
    <button id="load-btn" class="secondary">عرض برنامجه</button>
    <ul id="coach-list"></ul>
    <div class="row">
      <input id="ex-name" placeholder="اسم التمرين">
      <input id="ex-sets" type="number" placeholder="مجموعات">
      <input id="ex-reps" placeholder="تكرار">
    </div>
    <button id="add-btn" class="secondary">+ إضافة تمرين</button>
    <button id="save-btn">حفظ البرنامج</button>
    <p class="message" id="coach-message"></p>
  </div>

  <!-- شاشة العميل -->
  <div class="card hidden" id="client-screen">
    <h2>تمرين اليوم</h2>
    <p class="progress" id="progress"></p>
    <ul id="list"></ul>
    <button id="finish">إنهاء التمرين</button>
    <button id="reset" class="secondary">ابدأ من جديد</button>
  </div>

  <button id="logout-btn" class="link hidden">تسجيل الخروج</button>

  <script type="module" src="app.js"></script>
</body>
</html>
